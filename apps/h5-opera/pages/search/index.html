<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8B1E24" />
  <title>搜索 · 沂蒙小戏小剧</title>
  <link rel="stylesheet" href="../../styles.css" />
</head>
<body>
  <main class="page">
    <div class="page-head">
      <div class="eyebrow">全站搜索</div>
      <h1>⌕ 找剧目 · 演员 · 剧团 · 影像 · 资讯</h1>
    </div>
    <input id="q" placeholder="输入关键词" style="width:100%;padding:14px 16px;font-size:16px;border:1px solid var(--ym-line);border-radius:8px;background:var(--ym-surface);outline:none;color:var(--ym-ink)" autofocus />
    <div id="results" class="grid" style="margin-top:24px"></div>
    <div id="empty" class="state" style="display:none"><span class="emoji">🔍</span>输入关键词开始检索</div>
  </main>
  <script type="module" src="./index.js"></script>
</body>
</html>
