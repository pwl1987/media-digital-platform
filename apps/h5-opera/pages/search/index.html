<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8B1E24" />
  <title>搜索 · 沂蒙小戏小剧</title>
  <link rel="stylesheet" href="../../styles.css" />
</head>
<body>
  <main class="page">
    <div class="page-head">
      <span class="eyebrow">全站检索</span>
      <h1>搜索</h1>
      <p class="subtitle">剧目 · 演员 · 剧团 · 活动 · 影像 · 资讯</p>
    </div>
    <div class="search-input-wrap">
      <span class="icon">⌕</span>
      <input id="q" placeholder="输入关键词，如：红嫂" />
    </div>
    <div id="results" class="grid" style="margin-top:24px"></div>
    <div id="empty" class="state" style="display:none"><span class="emoji">🔍</span>输入关键词开始检索</div>
  </main>
  <script type="module" src="./index.js"></script>
</body>
</html>
